[platformio]
src_dir = devices

[env:bridge]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
    +<bridge/src/>

monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D VESC_CAN_ID=62
    -D CAN_BITRATE=500000

[env:steering]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
    +<steering/src/>
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CAN_BITRATE=500000
    -D STEERING_NODE_ID=10
    -D STEERING_PWM_PIN=1
    -D STEERING_PWM_HZ=1000
    -D STEERING_START_POSITION=128
